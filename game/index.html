<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Handi Golf</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="game.css?v=20261114-1">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #e6e9e4; overflow: hidden; }
  @media (prefers-color-scheme: dark) { body { background: #0c0f0d; } }
  #game { height: 100vh; height: 100dvh; }
  noscript { display: block; padding: 16px; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<main id="game"></main>
<noscript>Handi Golf needs JavaScript to run.</noscript>
<script type="module">
  // Standalone page: mounts the game with local-only adapters. No login, no
  // database, no network. Dev aids: ?mode=daily, ?seed=abc, ?date=YYYY-MM-DD.
  import { mount } from '../js/game/index.js?v=20261114-3';
  import { createLocalAdapters } from './local-adapters.js';

  const q = new URLSearchParams(location.search);
  const adapters = createLocalAdapters({ date: q.get('date') || undefined });
  window.handiGolf = mount(document.getElementById('game'), {
    mode: q.get('mode') || (q.get('seed') ? 'endless' : 'daily'),
    seed: q.get('seed') || undefined,
    storage: adapters.storage,
    daily: adapters.daily,
  });
</script>
</body>
</html>
